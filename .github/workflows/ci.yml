name: CI - Documentation & Assets Linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-docs-and-assets:
    name: Lint Markdown, HTML & CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linters
        run: |
          npm install -g markdownlint-cli2 stylelint stylelint-config-standard

      - name: Lint Markdown Files
        run: markdownlint-cli2 "**/*.md"

      - name: Validate CSS Assets
        run: |
          npx stylelint "html/**/*.css" --allow-empty-input --config '{"extends": "stylelint-config-standard"}'
